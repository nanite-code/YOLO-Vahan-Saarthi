<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOLO Vahan Sarthi</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Background Animated Blobs -->
    <div class="blob shape-1"></div>
    <div class="blob shape-2"></div>

    <div class="glass-panel">
        <div class="glass-panel-inner">
            <header>
                <div class="logo-wrapper">
                    <span class="icon">🚙</span>
                    <h1>Vahan Sarthi</h1>
                </div>
                <p class="subtitle">AI-Powered Vehicle Detection</p>
            </header>

            <!-- Upload Section -->
            <div id="uploadDropzone" class="upload-section" style="padding: 40px; border-radius: 16px;">
                <div class="upload-content">
                    <svg class="upload-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                    </svg>
                    <p>Drag and drop image or video here</p>
                    <span class="divider">or</span>
                    <button id="uploadBtn" class="btn btn-primary">Browse Files</button>
                </div>
            </div>

            <!-- Hidden File Input -->
            <input type="file" id="fileInput" class="hidden" accept="image/*,video/*">

            <!-- Loading State -->
            <div id="loading" class="loading-state hidden">
                <div class="spinner"></div>
                <p>Processing with YOLO...</p>
            </div>

            <!-- Result Section -->
            <div id="resultSection" class="result-section hidden">
                <div class="result-header">
                    <h2>Detection Results</h2>
                    <a id="downloadCsvBtn" class="btn btn-secondary" href="#" download>
                        <svg class="download-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="margin-right: 8px;">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                        </svg> 
                        Download CSV
                    </a>
                </div>
                <div id="mediaContainer" class="media-container"></div>
            </div>
        </div>
    </div>

    <!-- Script -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
